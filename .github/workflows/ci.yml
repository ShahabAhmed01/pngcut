name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify output artifacts
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/privacy.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml