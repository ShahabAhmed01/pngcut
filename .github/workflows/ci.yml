name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines: node >= 20.19.0
          node-version: 20.19
          cache: npm

      - name: Install
        run: npm ci

      # Production-dependency audit. Fails only on critical-severity issues in
      # production dependencies. The one known high-severity transitive issue
      # (zod via @imgly/background-removal) cannot be fixed without a breaking
      # dependency downgrade and is tracked in SECURITY.md, so it is an
      # accepted, documented risk rather than a CI blocker.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify output artifacts
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/privacy.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-512.png
          test -f dist/icons/icon-maskable-512.png
